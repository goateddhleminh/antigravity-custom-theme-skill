<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 38" fill="none">
  <defs>
    <linearGradient id="waveArc" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Ocean Horizon Arc -->
  <path d="M 6 27 Q 64 8 122 23" stroke="url(#waveArc)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 18 31 Q 66 14 114 27" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Sunset Sun dipping into the horizon at x=86, y=18 -->
  <g transform="translate(86, 17)">
    <circle cx="0" cy="0" r="4.5" fill="url(#sunGrad)"/>
    <!-- Water reflection ripple line -->
    <path d="M -7 6 Q 0 4 7 6" stroke="#fde047" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- Ocean waves -->
  <path d="M 34 18 Q 38 14 42 17 Q 46 20 50 16" stroke="#67e8f9" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Star / glint on water -->
  <path d="M 18 20 L 19.3 17.2 L 22 16 L 19.3 14.8 L 18 12 L 16.7 14.8 L 14 16 L 16.7 17.2 Z" fill="#38bdf8" opacity="0.95"/>
  <circle cx="112" cy="17" r="1.4" fill="#06b6d4" opacity="0.85"/>
  <circle cx="68" cy="16" r="1.1" fill="#ffffff" opacity="0.8"/>
</svg>
