<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 38" fill="none">
  <defs>
    <linearGradient id="cometArc" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cometHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Comet main streak -->
  <path d="M 6 28 Q 64 6 122 22" stroke="url(#cometArc)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Secondary split tail -->
  <path d="M 22 30 Q 68 12 116 26" stroke="#c084fc" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Blazing Comet Star at x=88, y=16 -->
  <g transform="translate(88, 16) rotate(-15)">
    <path d="M 0 -6 L 1.8 -1.8 L 6 0 L 1.8 1.8 L 0 6 L -1.8 1.8 L -6 0 L -1.8 -1.8 Z" fill="url(#cometHead)"/>
    <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
  </g>
  <!-- Small Stars / Twilight Particles -->
  <path d="M 18 20 L 19.3 17.2 L 22 16 L 19.3 14.8 L 18 12 L 16.7 14.8 L 14 16 L 16.7 17.2 Z" fill="#38bdf8" opacity="0.95"/>
  <circle cx="48" cy="14" r="1.2" fill="#c084fc" opacity="0.85"/>
  <circle cx="112" cy="16" r="1.4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="32" cy="18" r="1.1" fill="#ffffff" opacity="0.8"/>
</svg>
